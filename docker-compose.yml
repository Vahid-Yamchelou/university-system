services:
  mysql:
    image: mysql:8.0
    container_name: uni-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: uni-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # Management-UI (guest/guest)

volumes:
  mysql_data: